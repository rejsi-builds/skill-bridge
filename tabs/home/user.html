<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillBridge</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/home/user.css">
</head>

<body class="user-page">

    <div class="container">

        <h1>My Profile</h1>
        <p class="subtitle">Continue your learning journey or teach a skill.</p>

        <div class="layout">

            <!-- Personal details (filled by user.js) -->
            <div class="card" id="profileCard"></div>

            <!-- Learn and Teach buttons -->
            <div class="actions">
                <a class="action learn" href="../learning/dashboard.html">
                    <strong>Learn</strong>
                    <span>Go to my learning journey</span>
                </a>

                <a class="action teach" href="../teaching.html">
                    <strong>Teach</strong>
                    <span>Share a skill with others</span>
                </a>
            </div>

        </div>

    </div>

    <script src="../../scripts/shared/store.js"></script>
    <script src="../../scripts/learning/data.js"></script>
    <script src="../../scripts/home/user.js"></script>
</body>

</html>
