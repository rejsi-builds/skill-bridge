<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - SkillBridge</title>
  <link rel="stylesheet" href="../../styles/style.css">
  <link rel="stylesheet" href="../../styles/home/auth.css">
</head>
<body class="auth-page">

  <div class="auth-box">

    <a href="welcome.html"><img src="../../images/SkillBridge.png" alt="SkillBridge"></a>

    <h1>Welcome back</h1>
    <p>Log in with your Epoka account</p>

    <form action="explore.html">
      <label>Email</label>
      <input type="email" required>

      <label>Password</label>
      <input type="password" required>

      <button type="submit">Log in</button>
    </form>

    <p>Don't have an account? <a href="signup.html">Sign up</a></p>

  </div>

</body>
</html>
